name: Bug
description: Something on the live site is broken or wrong.
title: "fix(<area>): <symptom>"
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: happen
    attributes:
      label: What happens
      description: The URL, the viewport (390px or desktop), the theme, and what you see.
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: prove
    attributes:
      label: Prove
      description: The smallest steps, curl, or screenshot that shows the defect.
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent epic (optional)
      placeholder: "#66"
    validations:
      required: false
