name: Epic
description: A capability tracker. Split into tasks before building.
title: "epic: <capability>"
labels: ["epic", "size-L", "needs-triage", "judgment"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What readers or the site gain, and the evidence that prompted it.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in, and what is out.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Combined acceptance. Children closed or deferred with a reason.
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: Children
      description: A checklist of child issues, in priority order.
    validations:
      required: false
