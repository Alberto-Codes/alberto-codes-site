name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Export static frontend
        working-directory: src
        env:
          API_URL: "https://alberto.codes"
          DEPLOY_URL: "https://alberto.codes"
        run: uv run reflex export --frontend-only --no-zip --env prod

      - name: Copy CNAME to export
        run: cp CNAME src/.web/build/client/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/.web/build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
