  <title id="jev-answer-key-t">Jev&#x27;s answer against my answer key, message by message</title>
  <desc id="jev-answer-key-d">Six messages from the two topics I counted as yes. For each, my answer key said yes. Charged twice: I have multiple charges on the same transaction, Jev 16 percent. What are my remedies if I think I was charged twice for the same expense, Jev 16 percent. Extra charge: When will the $1 transaction be credited to me, Jev 7 percent. Why are there so many fees on my statement, Jev 8 percent. There is a fee I don&#x27;t recognize on my statement, Jev 78 percent. I do not remember purchasing anything for 1 pound, and it is on my statement, Jev 87 percent. Jev scored the questions about fees and double charges low and the charges the customer did not make high; my key said yes to all six.</desc>
