  <title id="t">Ten days forecast at 30 percent, three ways</title>
  <desc id="d">Three rows of ten days, each day forecast at a 30 percent chance of rain. Top row, calibrated: it rained on 3 of the 10 days. Middle row, too cautious: it rained on 9 of the 10. Bottom row, too alarmed: it rained on none. A forecast is calibrated when its percentages match how often the thing happens.</desc>
