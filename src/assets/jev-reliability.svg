  <title id="jev-reliability-t">Three reliability diagrams for Jev's Noul answers</title>
  <desc id="jev-reliability-d">Three charts side by side. Each plots Jev's average percentage in ten buckets, across, against how often the answer was really yes, up, with a dashed diagonal where the two would match. Left: scam text messages, 500 messages, average gap 7 points, dots close to the line. Middle: bank messages with my six topics counted as yes, 480 messages, average gap 17 points; between 20 and 50 percent predicted, 87.5 to 93 percent were labelled yes, far above the line. Right: the same 480 answers with two topics recounted as no, average gap 6 points, dots back on the line.</desc>
