  <title id="jev-two-scores-t">Same answers, two scores, before and after relabelling</title>
  <desc id="jev-two-scores-d">Two small charts. Left, the sorting score, where higher is better: 0.986 with my first labels and 0.972 after relabelling two topics, nearly the same. Right, the average gap, where lower is better: 17 points with my first labels and 6 points after relabelling, about a third. Changing two topics&#x27; labels barely moved the sorting score and cut the average gap by about two thirds.</desc>
