  </style><title id="nemotron-request-path-title">Where a receipt waits: configured request path</title><rect x="1" y="1" width="618" height="848" rx="12" style="fill:var(--fig-bg);stroke:var(--fig-grid);stroke-width:1.5"/><text x="28" y="43" style="font-family:system-ui,sans-serif;font-size:28px;font-weight:700;fill:var(--fig-ink)"><tspan x="28" dy="0">Where a receipt waits</tspan></text><text x="28" y="77" style="font-family:system-ui,sans-serif;font-size:22px;font-weight:400;fill:var(--fig-muted)"><tspan x="28" dy="0">Configured limits, not current occupancy</tspan></text><rect x="48" y="102" width="524" height="82" rx="12" style="fill:var(--fig-accent-1-soft);stroke:var(--fig-grid);stroke-width:1.5"/><text x="70" y="135" style="font-family:system-ui,sans-serif;font-size:24px;font-weight:700;fill:var(--fig-ink)"><tspan x="70" dy="0">Scheduled arrival</tspan></text><text x="70" y="165" style="font-family:system-ui,sans-serif;font-size:22px;font-weight:400;fill:var(--fig-ink)"><tspan x="70" dy="0">The 30-second deadline starts here</tspan></text><path d="M310 185 V211 m-6 -8 l6 8 6 -8" style="fill:none;stroke:var(--fig-muted);stroke-width:2"/><rect x="48" y="213" width="524" height="111" rx="12" style="fill:var(--fig-bg);stroke:var(--fig-grid);stroke-width:1.5"/><text x="70" y="247" style="font-family:system-ui,sans-serif;font-size:24px;font-weight:700;fill:var(--fig-ink)"><tspan x="70" dy="0">Client waiting queue</tspan></text><text x="70" y="278" style="font-family:system-ui,sans-serif;font-size:22px;font-weight:400;fill:var(--fig-ink)"><tspan x="70" dy="0">64 waiting slots</tspan></text><text x="70" y="309" style="font-family:system-ui,sans-serif;font-size:22px;font-weight:400;fill:var(--fig-bad)"><tspan x="70" dy="0">Full? Reject the new arrival.</tspan></text><path d="M310 359 V369 m-6 -8 l6 8 6 -8" style="fill:none;stroke:var(--fig-muted);stroke-width:2"/><text x="70" y="354" style="font-family:system-ui,sans-serif;font-size:22px;font-weight:400;fill:var(--fig-accent-1)"><tspan x="70" dy="0">Chart below measures delay to this point ↓</tspan></text><rect x="48" y="371" width="524" height="86" rx="12" style="fill:var(--fig-accent-1-soft);stroke:var(--fig-grid);stroke-width:1.5"/><text x="70" y="405" style="font-family:system-ui,sans-serif;font-size:24px;font-weight:700;fill:var(--fig-ink)"><tspan x="70" dy="0">16 client workers</tspan></text><text x="70" y="437" style="font-family:system-ui,sans-serif;font-size:22px;font-weight:400;fill:var(--fig-ink)"><tspan x="70" dy="0">Each can await one HTTP response</tspan></text><path d="M310 458 V486 m-6 -8 l6 8 6 -8" style="fill:none;stroke:var(--fig-muted);stroke-width:2"/><rect x="48" y="488" width="524" height="120" rx="12" style="fill:var(--fig-accent-2-soft);stroke:var(--fig-grid);stroke-width:1.5"/><text x="70" y="522" style="font-family:system-ui,sans-serif;font-size:24px;font-weight:700;fill:var(--fig-ink)"><tspan x="70" dy="0">vLLM / Nemotron on one 4090</tspan></text><text x="70" y="554" style="font-family:system-ui,sans-serif;font-size:22px;font-weight:400;fill:var(--fig-ink)"><tspan x="70" dy="0">Separate server waiting queue</tspan><tspan x="70" dy="29.700000000000003">Up to 8 active model sequences</tspan></text><path d="M310 609 V638 m-6 -8 l6 8 6 -8" style="fill:none;stroke:var(--fig-muted);stroke-width:2"/><rect x="48" y="640" width="524" height="86" rx="12" style="fill:var(--fig-bg);stroke:var(--fig-grid);stroke-width:1.5"/><text x="70" y="674" style="font-family:system-ui,sans-serif;font-size:24px;font-weight:700;fill:var(--fig-ink)"><tspan x="70" dy="0">Response returned</tspan></text><text x="70" y="706" style="font-family:system-ui,sans-serif;font-size:22px;font-weight:400;fill:var(--fig-ink)"><tspan x="70" dy="0">The text still needs a quality check</tspan></text><text x="48" y="771" style="font-family:system-ui,sans-serif;font-size:22px;font-weight:400;fill:var(--fig-muted)"><tspan x="48" dy="0">30 seconds total, including waiting.</tspan><tspan x="48" dy=