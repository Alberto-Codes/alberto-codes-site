<svg id="fig-saucier-cut-stream" xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 840 440" style="max-width: 840px; background-color: transparent; font-family: 'trebuchet ms', verdana, arial, sans-serif; font-size: 14px;" role="img" aria-labelledby="saucier-cut-stream-t saucier-cut-stream-d">
  <title id="saucier-cut-stream-t">A stream cut at a line boundary</title>
  <desc id="saucier-cut-stream-d">A column of 293 numbered lines. Line 1 is the catalogue record for escoffier-1909, stating 151 preparations; line 2 is the catalogue record for escoffier-1907, stating 140. Lines 3 to 292 are preparation records, drawn solid green. Line 293, STRAWBERRY SAUCE of the scan at line 41807, is drawn in dashed orange and struck through, labelled deleted. A note beside the green lines reads: every remaining line is valid JSON. An arrow from line 2 to the reader's verdict reads: line 2: catalogue 'escoffier-1907' states 140 preparations, the stream carries 139, exit 2. Caption: syntax cannot see a missing line; the record that promised a count can.</desc>
  <rect x="0" y="0" width="100%" height="100%" rx="12" style="fill:var(--fig-bg)"/>
  <defs>
    <marker id="saucier-cut-stream-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:var(--fig-accent-2)"/></marker>
  </defs>
  <style>/* fig-tokens v1: generated by src/alberto_codes_site/figures.py, do not edit */
    svg:root { --fig-bg: #f6f8fa; --fig-ink: #1f2328; --fig-muted: #59636e; --fig-grid: #818b98; --fig-accent-1: #0969da; --fig-accent-2: #a85200; --fig-good: #1a7f37; --fig-bad: #cf222e; --fig-accent-3: #8250df; --fig-accent-1-soft: #ddf4ff; --fig-accent-2-soft: #fff1e5; --fig-accent-3-soft: #fbefff; --fig-good-soft: #dafbe1; --fig-bad-soft: #ffebe9; --fig-muted-soft: #e6eaef; }
    @media (prefers-color-scheme: dark) {
      svg:root { --fig-bg: #1f2020; --fig-ink: #cccccc; --fig-muted: #8f8f8f; --fig-grid: #707070; --fig-accent-1: #6cb6ff; --fig-accent-2: #d9894a; --fig-good: #7fb069; --fig-bad: #e07a5f; --fig-accent-3: #b083f0; --fig-accent-1-soft: #1d3a5c; --fig-accent-2-soft: #4a3418; --fig-accent-3-soft: #35284f; --fig-good-soft: #233d26; --fig-bad-soft: #4a2620; --fig-muted-soft: #333638; }
    }
  </style>
  <style>
    #fig-saucier-cut-stream .rec { fill: var(--fig-bg); stroke: var(--fig-good); stroke-width: 1.5px; }
    #fig-saucier-cut-stream .cat { fill: var(--fig-bg); stroke: var(--fig-ink); stroke-width: 1.5px; }
    #fig-saucier-cut-stream .gone { fill: none; stroke: var(--fig-accent-2); stroke-width: 2px; stroke-dasharray: 5 3; }
    #fig-saucier-cut-stream .verdict { fill: var(--fig-bg); stroke: var(--fig-accent-2); stroke-width: 2px; }
    #fig-saucier-cut-stream .eo { stroke: var(--fig-accent-2); stroke-width: 2px; fill: none; }
    #fig-saucier-cut-stream .strike { stroke: var(--fig-accent-2); stroke-width: 2px; }
    #fig-saucier-cut-stream text { fill: var(--fig-ink); text-anchor: middle; }
    #fig-saucier-cut-stream .l { text-anchor: start; }
    #fig-saucier-cut-stream .n { text-anchor: end; fill: var(--fig-muted); font-size: 12px; }
    #fig-saucier-cut-stream .h { font-size: 15px; font-weight: bold; }
    #fig-saucier-cut-stream .h.o { fill: var(--fig-accent-2); }
    #fig-saucier-cut-stream .h.g { fill: var(--fig-good); }
    #fig-saucier-cut-stream .s { font-size: 12px; fill: var(--fig-muted); }
    #fig-saucier-cut-stream .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; }
    #fig-saucier-cut-stream .o { fill: var(--fig-accent-2); }
    #fig-saucier-cut-stream .g { fill: var(--fig-good); }
    #fig-saucier-cut-stream .div { stroke: var(--fig-grid); stroke-width: 1px; stroke-dasharray: 3 4; }
  </style>

  <text class="h" x="264" y="34">the export, 293 lines, minus the last one</text>
  <text class="s" x="264" y="52">saucier export | head -n -1</text>

  <!-- line 1: catalogue 1909 -->
  <text class="n" x="52" y="93">1</text>
  <rect class="cat" x="62" y="76" width="404" height="26" rx="2"/>
  <text class="l mono" x="70" y="94">catalogue  escoffier-1909  "preparations":151</text>

  <!-- line 2: catalogue 1907 -->
  <text class="n" x="52" y="125">2</text>
  <rect class="cat" x="62" y="108" width="404" height="26" rx="2"/>
  <text class="l mono" x="70" y="126">catalogue  escoffier-1907  "preparations":140</text>

  <!-- lines 3..292 as a stack -->
  <text class="n" x="52" y="157">3</text>
  <rect class="rec" x="62" y="140" width="404" height="26" rx="2"/>
  <text class="l mono" x="70" y="158">preparation  escoffier-1909:line:1317  BROWN ROUX</text>

  <text class="n" x="52" y="189">4</text>
  <rect class="rec" x="62" y="172" width="404" height="26" rx="2"/>
  <text class="l mono" x="70" y="190">preparation  escoffier-1909:line:1374  PALE ROUX</text>

  <text class="n" x="52" y="221">⋮</text>
  <rect class="rec" x="62" y="204" width="404" height="26" rx="2" stroke-dasharray="2 4"/>
  <text class="l s" x="70" y="222">287 more preparation records: the rest of the text, then the scan</text>

  <text class="n" x="52" y="253">292</text>
  <rect class="rec" x="62" y="236" width="404" height="26" rx="2"/>
  <text class="l mono" x="70" y="254">preparation  escoffier-1907:line:41802  RASPBERRY SAUCE</text>

  <!-- line 293: deleted -->
  <text class="n o" x="52" y="285">293</text>
  <rect class="gone" x="62" y="268" width="404" height="26" rx="2"/>
  <text class="l mono o" x="70" y="286">preparation  escoffier-1907:line:41807  STRAWBERRY SAUCE</text>
  <line class="strike" x1="66" y1="281" x2="462" y2="281"/>
  <text class="n o" x="52" y="300">deleted</text>

  <text class="s g" x="264" y="322">every remaining line is valid JSON</text>
  <text class="s" x="264" y="340">a reader that only asks "did every line parse" says yes</text>

  <!-- divider -->
  <line class="div" x1="492" y1="70" x2="492" y2="350"/>

  <!-- RIGHT: the verdict -->
  <text class="h o" x="665" y="34">the reader</text>
  <text class="s" x="665" y="52">saucier import --check</text>

  <path class="eo" d="M466,121 L478,121 L478,190 L508,190" marker-end="url(#saucier-cut-stream-ao)"/>

  <g transform="translate(512, 150)">
    <rect class="verdict" x="0" y="0" width="306" height="84" rx="2"/>
    <text class="l mono" x="12" y="24">saucier: line 2: catalogue</text>
    <text class="l mono" x="12" y="42">'escoffier-1907' states 140</text>
    <text class="l mono" x="12" y="60">preparations, the stream carries 139</text>
    <text class="l mono o" x="12" y="78">exit 2</text>
  </g>

  <text class="s" x="665" y="272">the line number points at the record</text>
  <text class="s" x="665" y="290">that made the promise, not at the gap</text>

  <text class="s" x="420" y="405">syntax cannot see a missing line. the record that promised a count can.</text>
</svg>
