<svg id="fig-saucier-derived-waterfall" xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 840 430" style="max-width: 840px; background-color: transparent; font-family: 'trebuchet ms', verdana, arial, sans-serif; font-size: 15px;" role="img" aria-labelledby="saucier-derived-waterfall-t saucier-derived-waterfall-d">
  <title id="saucier-derived-waterfall-t">Derived went from 50 to 57, and the seven is three numbers</title>
  <desc id="saucier-derived-waterfall-d">A waterfall chart. Derived at v0.3.0 is 50. Twelve sauces gained a parent, up to 62. Ten sauces lost one, down to 52, drawn in dashed orange. Five admitted entries state a parent of their own, up to 57. Derived at v0.4.0 is 57. The net gain of seven hides a loss of ten.</desc>
  <style>/* fig-tokens v1: generated by src/alberto_codes_site/figures.py, do not edit */
    svg:root { --fig-bg: #f6f8fa; --fig-ink: #1f2328; --fig-muted: #59636e; --fig-grid: #818b98; --fig-accent-1: #0969da; --fig-accent-2: #a85200; --fig-good: #1a7f37; --fig-bad: #cf222e; --fig-accent-3: #8250df; --fig-accent-1-soft: #ddf4ff; --fig-accent-2-soft: #fff1e5; --fig-accent-3-soft: #fbefff; --fig-good-soft: #dafbe1; --fig-bad-soft: #ffebe9; --fig-muted-soft: #e6eaef; }
    @media (prefers-color-scheme: dark) {
      svg:root { --fig-bg: #1f2020; --fig-ink: #cccccc; --fig-muted: #8f8f8f; --fig-grid: #707070; --fig-accent-1: #6cb6ff; --fig-accent-2: #d9894a; --fig-good: #7fb069; --fig-bad: #e07a5f; --fig-accent-3: #b083f0; --fig-accent-1-soft: #1d3a5c; --fig-accent-2-soft: #4a3418; --fig-accent-3-soft: #35284f; --fig-good-soft: #233d26; --fig-bad-soft: #4a2620; --fig-muted-soft: #333638; }
    }
  </style>
  <style>
    #fig-saucier-derived-waterfall .axis { stroke: var(--fig-muted); stroke-width: 1px; }
    #fig-saucier-derived-waterfall .tick { fill: var(--fig-muted); font-size: 13px; text-anchor: end; }
    #fig-saucier-derived-waterfall .gain { fill: var(--fig-bg); stroke: var(--fig-good); stroke-width: 2px; }
    #fig-saucier-derived-waterfall .total { fill: var(--fig-good-soft); stroke: var(--fig-good); stroke-width: 2px; }
    #fig-saucier-derived-waterfall .loss { fill: var(--fig-bg); stroke: var(--fig-accent-2); stroke-width: 2px; stroke-dasharray: 5 3; }
    #fig-saucier-derived-waterfall .link { stroke: var(--fig-muted); stroke-width: 1px; stroke-dasharray: 2 3; fill: none; }
    #fig-saucier-derived-waterfall .val { fill: var(--fig-ink); text-anchor: middle; font-weight: bold; font-size: 16px; }
    #fig-saucier-derived-waterfall .val.neg { fill: var(--fig-accent-2); }
    #fig-saucier-derived-waterfall .cat { fill: var(--fig-ink); text-anchor: middle; font-size: 13px; }
    #fig-saucier-derived-waterfall .note { fill: var(--fig-ink); font-size: 13px; text-anchor: middle; }
  </style>
  <rect x="0" y="0" width="100%" height="100%" rx="12" style="fill:var(--fig-bg)"/>

  <!-- axis: value v maps to y = 340 - (v - 40) * 10 -->
  <line class="axis" x1="90" y1="340" x2="810" y2="340"/>
  <g>
    <line class="axis" x1="86" y1="340" x2="90" y2="340"/><text class="tick" x="80" y="345">40</text>
    <line class="axis" x1="86" y1="240" x2="90" y2="240"/><text class="tick" x="80" y="245">50</text>
    <line class="axis" x1="86" y1="140" x2="90" y2="140"/><text class="tick" x="80" y="145">60</text>
  </g>

  <!-- bar 1: v0.3.0 total, 40 to 50 -->
  <rect class="total" x="110" y="240" width="110" height="100" rx="2"/>
  <text class="val" x="165" y="228">50</text>
  <text class="cat" x="165" y="362">derived</text>
  <text class="cat" x="165" y="380">at v0.3.0</text>
  <line class="link" x1="220" y1="240" x2="255" y2="240"/>

  <!-- bar 2: +12, 50 to 62 -->
  <rect class="gain" x="255" y="120" width="110" height="120" rx="2"/>
  <text class="val" x="310" y="108">+12</text>
  <text class="cat" x="310" y="362">gained the parent</text>
  <text class="cat" x="310" y="380">Escoffier wrote</text>
  <line class="link" x1="365" y1="120" x2="400" y2="120"/>

  <!-- bar 3: -10, 62 down to 52 -->
  <rect class="loss" x="400" y="120" width="110" height="100" rx="2"/>
  <text class="val neg" x="455" y="108">−10</text>
  <text class="cat" x="455" y="362">lost one to a butter</text>
  <text class="cat" x="455" y="380">or to half glaze</text>
  <line class="link" x1="510" y1="220" x2="545" y2="220"/>

  <!-- bar 4: +5, 52 to 57 -->
  <rect class="gain" x="545" y="170" width="110" height="50" rx="2"/>
  <text class="val" x="600" y="158">+5</text>
  <text class="cat" x="600" y="362">admitted entries that</text>
  <text class="cat" x="600" y="380">state a parent</text>
  <line class="link" x1="655" y1="170" x2="690" y2="170"/>

  <!-- bar 5: v0.4.0 total, 40 to 57 -->
  <rect class="total" x="690" y="170" width="110" height="170" rx="2"/>
  <text class="val" x="745" y="158">57</text>
  <text class="cat" x="745" y="362">derived</text>
  <text class="cat" x="745" y="380">at v0.4.0</text>

  <!-- the seven -->
  <line class="link" x1="165" y1="240" x2="745" y2="240"/>
  <text class="note" x="455" y="60">net +7, read alone, is a gain that hides a loss</text>

  <text class="note" x="450" y="418">escoffier-1909  ·  every bar is a list of named sauces in ADR-0015</text>
</svg>
