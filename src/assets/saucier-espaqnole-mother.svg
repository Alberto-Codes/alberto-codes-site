<svg id="fig-saucier-espaqnole-mother" xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 980 470" style="max-width: 980px; background-color: transparent; font-family: 'trebuchet ms', verdana, arial, sans-serif; font-size: 14px;" role="img" aria-labelledby="saucier-espaqnole-mother-t saucier-espaqnole-mother-d">
  <title id="saucier-espaqnole-mother-t">One scanned heading, and the 1907 Espagnole tree before and after the guard</title>
  <desc id="saucier-espaqnole-mother-d">Two states of the same lookup. Top, the heading of entry 22 as each witness carries it: the 1907 scan reads 22 em-dash BROWN SAUCE OR ESPAQNOLE at line 1730, with the Q drawn in orange, and the 1909 transcription reads ESPAGNOLE at line 1392. Below, two columns. Left, before: the only candidate for the mother espagnole is LENTEN ESPAGNOLE, entry 24 at line 1795, crowned because it is the only run match and there is nothing to rank, and the tree heads on LENTEN ESPAGNOLE with HALF GLAZE and its nine derivatives and the two Poivrade sauces beneath it. Right, after: that candidate is struck out because its opening paragraph states Espagnole, no candidate is left, the mother stays uncatalogued, and the tree heads on the bare concept espagnole with LENTEN ESPAGNOLE demoted to a child alongside the others. Caption: the guard removed one candidate in this witness, the 1907 census moved from 140 / 50 / 90 to 140 / 51 / 89, the 1909 catalogue came out byte-identical, and the heading was never repaired.</desc>
