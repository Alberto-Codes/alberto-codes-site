    svg:root { --fig-bg: #f6f8fa; --fig-ink: #1f2328; --fig-muted: #59636e; --fig-grid: #818b98; --fig-accent-1: #0969da; --fig-accent-2: #a85200; --fig-good: #1a7f37; --fig-bad: #cf222e; --fig-accent-3: #8250df; --fig-accent-1-soft: #ddf4ff; --fig-accent-2-soft: #fff1e5; --fig-accent-3-soft: #fbefff; --fig-good-soft: #dafbe1; --fig-bad-soft: #ffebe9; --fig-muted-soft: #e6eaef; }
