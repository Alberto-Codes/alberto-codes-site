<svg id="fig-saucier-one-record" xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 840 384" style="max-width: 840px; background-color: transparent; font-family: 'trebuchet ms', verdana, arial, sans-serif; font-size: 14px;" role="img" aria-labelledby="saucier-one-record-t saucier-one-record-d">
  <title id="saucier-one-record-t">One line, one record</title>
  <desc id="saucier-one-record-d">One JSON record laid out with callouts. The envelope: schema saucier/1, type preparation, id escoffier-1909:line:1467, which is the catalogue and the line the heading sits on. Then catalogue escoffier-1909, title ORDINARY VELOUTÉ SAUCE, and a terms list with one entry: surface ORDINARY VELOUTÉ SAUCE, language fr, concept ordinary-veloute-sauce. Then parent pale-roux, with a note that null here means unresolved and never means the sauce has none. Then ref: entry 25, line 1467, fidelity transcription, the address a reader checks by hand. A body field follows, elided. Beneath: 293 lines, 2 catalogue records then 291 preparation records, 271,730 bytes, the same SHA-256 on every run.</desc>
