  <title id="saucier-perigueux-page-break-t">Périgueux, and the page break between two names</title>
  <desc id="saucier-perigueux-page-break-d">Two panels of the same paragraph, entry 47, Périgueux Sauce. Left, escoffier-1909, the text: heading at line 1920, then one unbroken paragraph in which half-glaze at line 1923 and Madeira Sauce at line 1926 are both highlighted; the resolver reads two catalogued names and the verdict is parent unresolved, stated half-glaze, madeira-sauce. Right, escoffier-1907, the scan: heading at line 2314, half-glaze at line 2317 highlighted, then a blank line 2319 and the running page header 30 GUIDE TO MODERN COOKERY at line 2321, and only beyond them Madeira Sauce at line 2324, greyed out. The resolver reads the opening paragraph only, which ends at the blank line, so it sees one name and the verdict is parent half-glaze. Caption: the scan's paragraph ends at the blank line on 2319; the resolver never reads line 2324.</desc>
