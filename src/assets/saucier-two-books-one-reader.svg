  <defs>
    <marker id="saucier-two-books-one-reader-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:var(--fig-good)"/></marker>
    <marker id="saucier-two-books-one-reader-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:var(--fig-accent-2)"/></marker>
  </defs>
