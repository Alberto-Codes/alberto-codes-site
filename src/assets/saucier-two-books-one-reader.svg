<svg id="fig-saucier-two-books-one-reader" xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 840 470" style="max-width: 840px; background-color: transparent; font-family: 'trebuchet ms', verdana, arial, sans-serif; font-size: 14px;" role="img" aria-labelledby="saucier-two-books-one-reader-t saucier-two-books-one-reader-d">
  <title id="saucier-two-books-one-reader-t">Two books, one reader</title>
  <desc id="saucier-two-books-one-reader-d">Two panels. Left, the scan's blind spot: the 1907 scan and the 1909 text go into saucier diff, which measures 284 entries the scan cannot read, because a clean witness exists to compare against. Right, the mother clause's blind spot: both books go into the same is_sauce rule, and both come out missing the same 27 entries. Identical absences from two witnesses, and nothing to compare against. A second copy of the book cannot catch an error in the reader.</desc>
