    <text class="s" x="130" y="40">one rule, both books</text>
  </g>

  <path class="eo" d="M580,250 L580,296" marker-end="url(#saucier-two-books-one-reader-ao)"/>
  <path class="eo" d="M680,250 L680,296" marker-end="url(#saucier-two-books-one-reader-ao)"/>

