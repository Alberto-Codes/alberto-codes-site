  </g>
  <g transform="translate(640, 80)">
    <rect class="book" x="0" y="0" width="140" height="56" rx="2"/>
    <text x="70" y="24">escoffier-1909</text>
    <text class="s" x="70" y="42">text, Project Gutenberg</text>
  </g>

