<svg id="fig-saucier-veto-gate" xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 840 400" style="max-width: 840px; background-color: transparent; font-family: 'trebuchet ms', verdana, arial, sans-serif; font-size: 14px;" role="img" aria-labelledby="saucier-veto-gate-t saucier-veto-gate-d">
  <title id="saucier-veto-gate-t">The veto gate, at v0.3.0 and at v0.4.0</title>
  <desc id="saucier-veto-gate-d">Two rows of a decision flow. At v0.3.0: a numbered entry; does the heading say sauce, yes goes in; no, is it in a chapter titled as sauces; no goes out; yes reaches a third test, does the heading name a mother, drawn in dashed orange; no sends 27 entries out, yes goes in. At v0.4.0 the third test is gone: an entry in a chapter titled as sauces goes straight in.</desc>
  <rect x="0" y="0" width="100%" height="100%" rx="12" style="fill:var(--fig-bg)"/>
  <defs>
    <marker id="saucier-veto-gate-vg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:var(--fig-good)"/></marker>
    <marker id="saucier-veto-gate-vo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:var(--fig-accent-2)"/></marker>
    <marker id="saucier-veto-gate-vn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:var(--fig-muted)"/></marker>
  </defs>
  <style>/* fig-tokens v1: generated by src/alberto_codes_site/figures.py, do not edit */
    svg:root { --fig-bg: #f6f8fa; --fig-ink: #1f2328; --fig-muted: #59636e; --fig-grid: #818b98; --fig-accent-1: #0969da; --fig-accent-2: #a85200; --fig-good: #1a7f37; --fig-bad: #cf222e; --fig-accent-3: #8250df; --fig-accent-1-soft: #ddf4ff; --fig-accent-2-soft: #fff1e5; --fig-accent-3-soft: #fbefff; --fig-good-soft: #dafbe1; --fig-bad-soft: #ffebe9; --fig-muted-soft: #e6eaef; }
    @media (prefers-color-scheme: dark) {
      svg:root { --fig-bg: #1f2020; --fig-ink: #cccccc; --fig-muted: #8f8f8f; --fig-grid: #707070; --fig-accent-1: #6cb6ff; --fig-accent-2: #d9894a; --fig-good: #7fb069; --fig-bad: #e07a5f; --fig-accent-3: #b083f0; --fig-accent-1-soft: #1d3a5c; --fig-accent-2-soft: #4a3418; --fig-accent-3-soft: #35284f; --fig-good-soft: #233d26; --fig-bad-soft: #4a2620; --fig-muted-soft: #333638; }
    }
  </style>
  <style>
    #fig-saucier-veto-gate .q { fill: var(--fig-bg); stroke: var(--fig-ink); stroke-width: 1.5px; }
    #fig-saucier-veto-gate .in { fill: var(--fig-good-soft); stroke: var(--fig-good); stroke-width: 2px; }
    #fig-saucier-veto-gate .out { fill: var(--fig-bg); stroke: var(--fig-muted); stroke-width: 1.5px; }
    #fig-saucier-veto-gate .veto { fill: var(--fig-bg); stroke: var(--fig-accent-2); stroke-width: 2px; stroke-dasharray: 5 3; }
    #fig-saucier-veto-gate .en { stroke: var(--fig-muted); stroke-width: 1.5px; fill: none; }
    #fig-saucier-veto-gate .eg { stroke: var(--fig-good); stroke-width: 2px; fill: none; }
    #fig-saucier-veto-gate .eo { stroke: var(--fig-accent-2); stroke-width: 2px; fill: none; }
    #fig-saucier-veto-gate text { fill: var(--fig-ink); text-anchor: middle; }
    #fig-saucier-veto-gate .lbl { font-size: 12px; fill: var(--fig-muted); }
    #fig-saucier-veto-gate .row { font-size: 15px; font-weight: bold; text-anchor: start; }
    #fig-saucier-veto-gate .row.o { fill: var(--fig-accent-2); }
    #fig-saucier-veto-gate .row.g { fill: var(--fig-good); }
    #fig-saucier-veto-gate .div { stroke: var(--fig-grid); stroke-width: 1px; stroke-dasharray: 3 4; }
  </style>

  <!-- ROW 1: v0.3.0 -->
  <text class="row o" x="20" y="30">v0.3.0</text>

  <g transform="translate(20, 60)"><rect class="q" x="0" y="0" width="110" height="44" rx="22"/><text x="55" y="27">numbered entry</text></g>
  <path class="en" d="M130,82 L165,82" marker-end="url(#saucier-veto-gate-vn)"/>

  <g transform="translate(168, 60)"><rect class="q" x="0" y="0" width="140" height="44" rx="22"/><text x="70" y="27">heading says sauce?</text></g>
  <path class="eg" d="M308,82 L360,82 L360,42 L690,42 L690,60" marker-end="url(#saucier-veto-gate-vg)"/>
  <text class="lbl" x="335" y="76">yes</text>
  <path class="en" d="M238,104 L238,140" marker-end="url(#saucier-veto-gate-vn)"/>
  <text class="lbl" x="252" y="126">no</text>

  <g transform="translate(150, 144)"><rect class="q" x="0" y="0" width="176" height="44" rx="22"/><text x="88" y="27">in a chapter titled sauces?</text></g>
  <path class="en" d="M238,188 L238,224" marker-end="url(#saucier-veto-gate-vn)"/>
  <text class="lbl" x="252" y="210">no</text>
  <g transform="translate(193, 228)"><rect class="out" x="0" y="0" width="90" height="36" rx="18"/><text x="45" y="23">out</text></g>

  <path class="eo" d="M326,166 L400,166" marker-end="url(#saucier-veto-gate-vo)"/>
  <text class="lbl" x="363" y="160">yes</text>

  <g transform="translate(404, 144)"><rect class="veto" x="0" y="0" width="190" height="44" rx="22"/><text x="95" y="27">heading names a mother?</text></g>
  <path class="eo" d="M499,188 L499,224" marker-end="url(#saucier-veto-gate-vo)"/>
  <text class="lbl" x="513" y="210">no</text>
  <g transform="translate(414, 228)"><rect class="veto" x="0" y="0" width="170" height="36" rx="18"/><text x="85" y="23">out: 27 entries vetoed</text></g>
  <path class="eg" d="M594,166 L640,166 L640,82 L660,82" marker-end="url(#saucier-veto-gate-vg)"/>
  <text class="lbl" x="617" y="160">yes</text>

  <g transform="translate(660, 60)"><rect class="in" x="0" y="0" width="160" height="44" rx="22"/><text x="80" y="27">in the catalogue: 124</text></g>

  <line class="div" x1="20" y1="286" x2="820" y2="286"/>

  <!-- ROW 2: v0.4.0 -->
  <text class="row g" x="20" y="316">v0.4.0</text>

  <g transform="translate(20, 336)"><rect class="q" x="0" y="0" width="110" height="44" rx="22"/><text x="55" y="27">numbered entry</text></g>
  <path class="en" d="M130,358 L165,358" marker-end="url(#saucier-veto-gate-vn)"/>
  <g transform="translate(168, 336)"><rect class="q" x="0" y="0" width="140" height="44" rx="22"/><text x="70" y="27">heading says sauce?</text></g>
  <path class="en" d="M308,358 L340,358" marker-end="url(#saucier-veto-gate-vn)"/>
  <text class="lbl" x="324" y="352">no</text>
  <g transform="translate(344, 336)"><rect class="q" x="0" y="0" width="176" height="44" rx="22"/><text x="88" y="27">in a chapter titled sauces?</text></g>
  <path class="eg" d="M520,358 L656,358" marker-end="url(#saucier-veto-gate-vg)"/>
  <text class="lbl" x="588" y="345">yes, and that decides it</text>
  <g transform="translate(660, 336)"><rect class="in" x="0" y="0" width="160" height="44" rx="22"/><text x="80" y="27">in the catalogue: 151</text></g>
</svg>
