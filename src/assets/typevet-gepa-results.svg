<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 840 330" style="max-width: 840px; background-color: transparent; font-family: 'trebuchet ms', verdana, arial, sans-serif; font-size: 14px;" role="img" aria-labelledby="t d">
  <title id="t">Each judge with the original question and with its own rewrite</title>
  <desc id="d">Two charts, one row per judge. Hollow gray dot: original question. Filled green dot: the judge's own rewrite. Left, messages right out of 158, higher is better: Jev 151 to 155; Gemma 4 31B on my RTX 4090 131 to 153; Gemma 4 31B on a rented H100 128 to 153. Right, average gap between stated percentage and what happened, in points, lower is better: Jev 8.9 to 7.1; Gemma 4 on the 4090 17.0 to 3.4; Gemma 4 on the H100 18.5 to 3.4.</desc>
