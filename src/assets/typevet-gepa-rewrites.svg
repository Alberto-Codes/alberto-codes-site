  <rect x="0" y="0" width="840" height="400" rx="12" style="fill:var(--fig-bg)"/>
  <text class="m" x="30" y="34">STARTING QUESTION FOR BOTH: IS THIS MESSAGE A SCAM, PHISHING OR SOCIAL-ENGINEERING ATTEMPT?</text>
  <rect x="30" y="52" width="370" height="320" rx="10" stroke-width="1.5" style="fill:var(--fig-bg);stroke:var(--fig-grid)"/>
  <text class="m" x="50" y="82">GEMMA 4 NARROWED IT</text>
  <text x="50" y="108">"Label 1 only for obvious deceptive</text>
  <text x="50" y="130">scam/phishing/social engineering;</text>
  <text x="50" y="152">ignore personal text."</text>
  <line x1="50" y1="186" x2="380" y2="186" style="stroke:var(--fig-grid)"/>
  <text class="m" x="50" y="212">EXAMPLE, NOT A SCAM</text>
  <text x="50" y="238">"I want to show you the world,</text>
  <text x="50" y="260">princess :) how about europe?"</text>
  <text class="m" x="50" y="306">ORIGINAL QUESTION</text><text class="m e" x="380" y="306">ITS OWN REWRITE</text>
  <text class="big" x="50" y="340">99.98%</text><text class="m" x="215" y="336" style="text-anchor:middle">CHANCE OF SCAM</text><text class="big g e" x="380" y="340">&lt;0.001%</text>
