  <text x="460" y="152">offer, call, alert"</text>
  <line x1="460" y1="186" x2="790" y2="186" style="stroke:var(--fig-grid)"/>
  <text class="m" x="460" y="212">EXAMPLE, LABELLED A SCAM</text>
