<svg id="fig-typevet-gepa-rewrites" xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 840 400" style="max-width: 840px; background-color: transparent; font-family: 'trebuchet ms', verdana, arial, sans-serif; font-size: 14px;" role="img" aria-labelledby="typevet-gepa-rewrites-t typevet-gepa-rewrites-d">
  <title id="typevet-gepa-rewrites-t">Two rewrites of one question, in opposite directions</title>
  <desc id="typevet-gepa-rewrites-d">Two cards. Left, Gemma 4's rewrite: Label 1 only for obvious deceptive scam/phishing/social engineering; ignore personal text. Example: I want to show you the world, princess :) how about europe?, labelled not a scam, went from 99.98 percent scam with the original question to under 0.001 percent with the rewrite. Right, Jev's rewrite: Predict probability (0-1) that message is scam/phishing/unsolicited promo, offer, call, alert. Example: a real-estate promotion ending For Best Deal Call, labelled a scam, went from 32 percent to 89 percent.</desc>
