<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" viewBox="0 0 840 440" style="max-width: 840px; background-color: transparent; font-family: 'trebuchet ms', verdana, arial, sans-serif; font-size: 14px;" role="img" aria-labelledby="t d">
  <title id="t">The same claim, with and without the receipt</title>
  <desc id="d">Top left, a real receipt photo cropped to its last lines: items 561,800, service charge 42,135, PB1 60,394, total 664,329. Top right, the claim: Expense claim for this receipt: total 646329. Two digits are swapped. Below, two answers from the same model. Claim sent without the photo: matches, 99.96 percent, which is wrong. Claim sent with the photo: does not match, 99.999 percent, which is right.</desc>
  <style>
    text { fill: #cccccc; }
    .m { fill: #888888; font-size: 12px; letter-spacing: 0.5px; }
    .h { font-size: 15px; font-weight: bold; }
    .big { font-size: 22px; font-weight: bold; }
    .e { text-anchor: end; }
    .bad { fill: #e07a5f; }
    .good { fill: #7fb069; }
  </style>
  <rect x="0" y="0" width="840" height="440" rx="12" fill="#1f2020"/>
  <text class="m" x="30" y="36">THE RECEIPT</text>
  <image x="30" y="48" width="420" height="115" preserveAspectRatio="xMidYMid slice" xlink:href="data:image/jpeg;base64,"/>
  <rect x="30" y="48" width="420" height="115" fill="none" stroke="#444444" stroke-width="1.5"/>
  <text class="m" x="490" y="36">THE CLAIM</text>
  <rect x="490" y="48" width="320" height="115" rx="10" fill="#1f2020" stroke="#444444" stroke-width="1.5"/>
  <text x="510" y="86">"Expense claim for this receipt:</text>
  <text x="510" y="112">total 646329."</text>
  <text class="m" x="510" y="146">THE RECEIPT SAYS 664,329.</text>
  <text class="m" x="30" y="206">SAME MODEL, SAME QUESTION: DOES THE CLAIM MATCH THE RECEIPT?</text>
  <rect x="30" y="220" width="780" height="80" rx="10" fill="#1f2020" stroke="#444444" stroke-width="1.5"/>
  <text class="h" x="50" y="253">Claim sent without the photo</text>
  <text class="m" x="50" y="278">NOTHING TO COMPARE AGAINST</text>
  <text class="big bad" x="420" y="258">matches</text>
  <text class="big bad e" x="790" y="258">99.96%</text>
  <text class="m e" x="790" y="282">WRONG</text>
  <rect x="30" y="316" width="780" height="80" rx="10" fill="#1f2020" stroke="#444444" stroke-width="1.5"/>
  <text class="h" x="50" y="349">Claim sent with the photo</text>
  <text class="m" x="50" y="374">THE RECEIPT IS ATTACHED</text>
  <text class="big good" x="420" y="354">does not match</text>
  <text class="big good e" x="790" y="354">99.999%</text>
  <text class="m e" x="790" y="378">RIGHT</text>
  <text class="m" x="30" y="424">Gemma 4 31B on one RTX 4090, asked through typevet. Receipt: CORD v2, validation row 59, CC BY 4.0.</text>
</svg>
