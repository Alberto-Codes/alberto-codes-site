<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="A 16 GiB card splits into a 15.776 GiB weight budget and a 0.224 GiB runtime reserve. The packed file lands at 15.760 GiB, 16.09 MiB under the budget. The reserve rounds up single-sequence runtime buffers, and the margin holds to 8 parallel sequences.">
  <text x="24" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#94a3b8">The 16 GiB budget, to the byte</text>

  <!-- the card bar -->
  <text x="24" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">A 16 GiB card</text>
  <rect x="24" y="74" width="700" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.4"/>
  <text x="374" y="94" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">16.000 GiB, total</text>

  <!-- the split: weights budget + runtime reserve -->
  <rect x="24" y="120" width="690" height="38" rx="4" fill="#1e40af" fill-opacity="0.35" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="369" y="137" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">15.776 GiB weight budget</text>
  <text x="369" y="152" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#93c5fd">what the solver targets</text>

  <rect x="716" y="120" width="8" height="38" rx="2" fill="#78350f" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.4"/>
  <path d="M720,114 L720,102 L640,102" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="634" y="106" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#fbbf24">0.224 GiB runtime reserve &#8212; KV cache, recurrent state, compute</text>

  <!-- the packed file -->
  <rect x="24" y="176" width="689" height="38" rx="4" fill="#14532d" fill-opacity="0.45" stroke="#4ade80" stroke-width="1.8"/>
  <text x="368" y="193" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">the packed file: 15.760 GiB</text>
  <text x="368" y="208" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#86efac">16.09 MiB under the weight budget</text>

  <text x="24" y="244" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">The reserve rounds up measured single-sequence buffers; the margin absorbs recurrent-state growth to 8 parallel sequences.</text>
  <text x="24" y="264" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Above 8 sequences, this budget does not hold &#8212; the card says so, and so does this post.</text>
</svg>
