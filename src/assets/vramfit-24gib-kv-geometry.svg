<svg id="fig-vramfit-24gib-kv-geometry" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332" role="img" aria-label="A 24 GiB card, twice. Google's QAT Q4_0 holds 16.44 GiB of weights and serves 65,536 tokens of text context. This pack holds 14.92 GiB and serves 86,016. The gap in weights is 1.52 GiB; the gap in served context is 20,480 tokens, 31.25 percent. Both are measured load boundaries on an RTX 4090, llama.cpp b10362 Vulkan, one sequence, 4,096-token rungs, measured 2026-08-31.">
