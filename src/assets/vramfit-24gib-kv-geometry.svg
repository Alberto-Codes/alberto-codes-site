<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="A 24 GiB card, twice. Google's QAT Q4_0 holds 16.44 GiB of weights and serves 65,536 tokens of text context. This pack holds 14.92 GiB and serves 86,016. The gap in weights is 1.52 GiB; the gap in served context is 20,480 tokens, 31.25 percent. Both are measured load boundaries on an RTX 4090, llama.cpp b10362 Vulkan, one sequence, 4,096-token rungs, measured 2026-08-31.">
<text x="24" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#94a3b8" font-weight="700">The same 24 GiB card, two ways to spend it</text>
<rect x="24" y="44" width="700" height="1" fill="#475569"/>
<text x="24" y="41" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b">0 GiB</text>
<text x="724" y="41" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="end">24 GiB</text>
<text x="24" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1" font-weight="700">Google's QAT Q4_0</text>
<rect x="24" y="78" width="479.5" height="34" rx="4" fill="#334155" fill-opacity="0.55" stroke="#64748b" stroke-width="1.6"/>
<text x="263.75" y="99" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#e2e8f0" font-weight="700" text-anchor="middle">16.44 GiB of weights</text>
<rect x="505.5" y="78" width="178.0" height="34" rx="4" fill="#14532d" fill-opacity="0.5" stroke="#4ade80" stroke-width="1.6"/>
<text x="594.5065104166667" y="95" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#e2e8f0" font-weight="700" text-anchor="middle">KV for 65,536</text>
<text x="594.5065104166667" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#86efac" text-anchor="middle">tokens, served</text>
<rect x="685.5" y="78" width="38.5" height="34" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
<text x="24" y="144" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1" font-weight="700">This pack (kv9)</text>
<rect x="24" y="152" width="435.2" height="34" rx="4" fill="#1e40af" fill-opacity="0.55" stroke="#60a5fa" stroke-width="1.6"/>
<text x="241.58333333333334" y="173" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#e2e8f0" font-weight="700" text-anchor="middle">14.92 GiB of weights</text>
<rect x="461.2" y="152" width="223.6" height="34" rx="4" fill="#14532d" fill-opacity="0.5" stroke="#4ade80" stroke-width="1.6"/>
<text x="572.9596354166667" y="169" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#e2e8f0" font-weight="700" text-anchor="middle">KV for 86,016</text>
<text x="572.9596354166667" y="182" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#86efac" text-anchor="middle">tokens, served</text>
<rect x="686.8" y="152" width="37.2" height="34" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
<text x="24" y="226" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#fbbf24" font-weight="700">Weights freed: 1.52 GiB.</text>
<text x="190" y="226" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#4ade80" font-weight="700">Context bought: +20,480 served tokens (+31.25%).</text>
<text x="24" y="250" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">Green segments price the served boundary at the runtime's measured 81,920 B/token past the sliding windows, plus the 1,200 MiB window pool.</text>
<text x="24" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">The dashed remainder is compute buffers, the desktop, and the rung the next load failed at. Only the 10 global layers of 60 grow with context.</text>
<text x="24" y="288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#64748b">RTX 4090, llama.cpp b10362 Vulkan, -ngl 99 -np 1, f16 KV, 4,096-token rungs, 2026-08-31.</text>
</svg>
