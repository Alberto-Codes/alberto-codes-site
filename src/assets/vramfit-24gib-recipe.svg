<text x="40" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">The sidecar came from Google's 1,145 MiB BF16 projector through llama-quantize's Q4_K_M recipe. It holds zero Q4_K tensors:</text>
