<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="A 24 GiB card does not give 24 GiB for weights. Reserving 16k of context leaves 20.47 GiB. That remainder is the number the solver targets, and it moves when the card or the context length changes.">
  <text x="24" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#94a3b8">Your card's size is not your budget</text>

  <!-- the card bar -->
  <text x="24" y="66" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">A 24 GiB card</text>
  <rect x="24" y="76" width="700" height="34" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.4"/>
  <text x="374" y="98" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#94a3b8">24 GiB of memory, total</text>

  <!-- the split -->
  <line x1="621" y1="118" x2="621" y2="140" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="3 3"/>

  <rect x="24" y="142" width="597" height="40" rx="4" fill="#1e40af" fill-opacity="0.35" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="322" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">20.47 GiB for the weights</text>
  <text x="322" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#93c5fd">this is the number the solver targets</text>

  <rect x="625" y="142" width="99" height="40" rx="4" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="674" y="160" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">3.53 GiB</text>
  <text x="674" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#fbbf24">16k of context</text>

  <!-- movable line callout -->
  <path d="M621,190 L621,206 M596,206 L646,206" fill="none" stroke="#64748b" stroke-width="1.3"/>
  <path d="M596,206 L604,201 M596,206 L604,211" fill="none" stroke="#64748b" stroke-width="1.3"/>
  <path d="M646,206 L638,201 M646,206 L638,211" fill="none" stroke="#64748b" stroke-width="1.3"/>
  <text x="621" y="226" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">a different card, or a longer context, moves this line</text>

  <text x="24" y="250" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">A preset is a fixed size and you hope it fits. Here the ceiling is an input, and the recipe is solved to meet it.</text>
</svg>
