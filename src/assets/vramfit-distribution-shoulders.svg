<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Two probability distributions over the next word. Both peak on the same top token, so greedy decoding picks the same word from either. The shoulders behind the peak differ, and that difference is what KL divergence measures.">
  <defs>
    <linearGradient id="fillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="fillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <text x="24" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#94a3b8">What the model actually produces: a shape, not a word</text>

  <!-- axes -->
  <line x1="60" y1="300" x2="716" y2="300" stroke="#475569" stroke-width="1.5"/>
  <line x1="60" y1="80" x2="60" y2="300" stroke="#475569" stroke-width="1.5"/>
  <text x="24" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">probability</text>

  <!-- distribution A: the original -->
  <path d="M60,300 C120,299 150,296 185,288 C215,281 235,262 252,196 C262,152 268,110 278,110 C288,110 294,152 304,196 C321,262 341,285 372,292 C420,300 500,300 560,300 C620,300 680,300 716,300 L716,300 L60,300 Z" fill="url(#fillA)" stroke="#60a5fa" stroke-width="2.5"/>

  <!-- distribution B: a quantization with heavier shoulders -->
  <path d="M60,300 C120,296 150,288 185,272 C215,258 233,244 252,200 C262,158 268,116 278,116 C288,116 294,158 304,200 C324,246 348,258 382,268 C440,283 505,289 566,293 C630,297 686,299 716,300 L716,300 L60,300 Z" fill="url(#fillB)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 4"/>

  <!-- shared peak marker -->
  <line x1="278" y1="104" x2="278" y2="300" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.7"/>
  <circle cx="278" cy="110" r="4.5" fill="#60a5fa"/>
  <circle cx="278" cy="116" r="4.5" fill="#f59e0b"/>
  <text x="278" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">same top word</text>
  <text x="278" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">greedy decoding only ever shows you this</text>

  <!-- legend, clear of the curve -->
  <line x1="486" y1="104" x2="518" y2="104" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="526" y="108" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#cbd5e1">the original, full precision</text>
  <line x1="486" y1="128" x2="518" y2="128" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="526" y="132" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#cbd5e1">a compressed copy</text>

  <!-- shoulder callout -->
  <path d="M452,268 L452,196 L512,196" fill="none" stroke="#f59e0b" stroke-width="1.4" opacity="0.85"/>
  <text x="520" y="192" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#fbbf24">the shoulders differ</text>
  <text x="520" y="210" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">this is what KL measures</text>
  <text x="520" y="226" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">and what sampling reaches</text>

  <text x="716" y="340" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#64748b">every possible next word, most likely first →</text>

  <text x="24" y="372" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Two copies can agree on the top word often enough to fool a spot check,</text>
  <text x="24" y="390" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">while the shape behind it drifts. Only measurement sees the rest.</text>
</svg>
