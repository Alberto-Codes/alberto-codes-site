<svg id="fig-vramfit-label-vs-file" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="Nemotron 3.5 Lightning by parameter share: the 46 expert stacks hold 93 percent of the parameters, and in the shelf's smallest build every one is silently rewritten to IQ4_NL at 4.5 bits per weight. The IQ2_XXS label names 12 of the build's 417 tensors, and not one expert stack is among them. The file lands at 17.54 GiB.">
