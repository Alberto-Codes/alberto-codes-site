<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="The shelf's smallest build is labeled IQ2_XXS, but that label names 12 of its 417 tensors. The 46 expert stacks, 93 percent of the parameters, are silently rewritten to IQ4_NL at 4.5 bits per weight, and the file lands at 17.54 GiB.">
  <text x="24" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#94a3b8">What the shelf's &#8220;IQ2_XXS&#8221; label actually names</text>

  <!-- the file bar, scaled by parameter share -->
  <text x="24" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">The smallest published build, by parameter share</text>
  <rect x="24" y="74" width="651" height="52" rx="4" fill="#334155" fill-opacity="0.55" stroke="#64748b" stroke-width="1.6"/>
  <text x="349" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">46 expert stacks &#8212; 93% of the parameters</text>
  <text x="349" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">silently rewritten to IQ4_NL at 4.5 bits/weight &#8212; 256 does not divide these rows</text>

  <rect x="679" y="74" width="45" height="52" rx="4" fill="#1e40af" fill-opacity="0.35" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="701" y="105" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">7%</text>

  <!-- callout: where the label's 12 tensors live -->
  <path d="M701,134 L701,154 L560,154" fill="none" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="552" y="158" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#fbbf24">the 12 tensors (of 417) that are actually IQ2_XXS live in here</text>

  <!-- consequence -->
  <line x1="24" y1="180" x2="724" y2="180" stroke="#475569" stroke-width="1"/>
  <text x="24" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">Result: a 2-bit-class label on a 17.54 GiB file.</text>
  <text x="24" y="226" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">A 16 GiB card is over before the first runtime buffer allocates. The fallback is the quantizer's, not the publisher's.</text>
  <text x="24" y="246" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">Every number from the published model card; the label share is 12 of 417 tensors, the stacks hold 93% of parameters.</text>
</svg>
