    }
  </style>
  <rect x="0" y="0" width="100%" height="100%" rx="12" style="fill:var(--fig-bg)"/>
  <defs>
    <marker id="vramfit-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:var(--fig-muted)"/>
    </marker>
  </defs>

  <text x="24" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" style="fill:var(--fig-muted)">Four steps, and what each one hands to the next</text>

  <!-- step boxes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="30" y="58" width="150" height="52" rx="8" stroke-width="1.8" style="fill:var(--fig-muted-soft);stroke:var(--fig-accent-1)"/>
    <text x="105" y="82" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--fig-ink)">Scan</text>
    <text x="105" y="100" text-anchor="middle" font-size="11.5" style="fill:var(--fig-muted)">crush one part at a time</text>

    <rect x="212" y="58" width="150" height="52" rx="8" stroke-width="1.8" style="fill:var(--fig-muted-soft);stroke:var(--fig-accent-1)"/>
    <text x="287" y="82" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--fig-ink)">Plan</text>
    <text x="287" y="100" text-anchor="middle" font-size="11.5" style="fill:var(--fig-muted)">spend where it counts</text>

    <rect x="394" y="58" width="150" height="52" rx="8" stroke-width="1.8" style="fill:var(--fig-muted-soft);stroke:var(--fig-accent-2)"/>
    <text x="469" y="82" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--fig-ink)">Validate</text>
    <text x="469" y="100" text-anchor="middle" font-size="11.5" style="fill:var(--fig-accent-2)">did the maths hold?</text>

    <rect x="576" y="58" width="150" height="52" rx="8" stroke-width="1.8" style="fill:var(--fig-muted-soft);stroke:var(--fig-accent-1)"/>
    <text x="651" y="82" text-anchor="middle" font-size="15" font-weight="700" style="fill:var(--fig-ink)">Pack</text>
    <text x="651" y="100" text-anchor="middle" font-size="11.5" style="fill:var(--fig-muted)">build it, then test it</text>
  </g>

  <!-- arrows between steps -->
  <line x1="182" y1="84" x2="208" y2="84" stroke-width="1.6" marker-end="url(#vramfit-pipeline-arrow)" style="stroke:var(--fig-muted)"/>
  <line x1="364" y1="84" x2="390" y2="84" stroke-width="1.6" marker-end="url(#vramfit-pipeline-arrow)" style="stroke:var(--fig-muted)"/>
  <line x1="546" y1="84" x2="572" y2="84" stroke-width="1.6" marker-end="url(#vramfit-pipeline-arrow)" style="stroke:var(--fig-muted)"/>

  <!-- what each hands on -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">
    <line x1="105" y1="112" x2="105" y2="146" stroke-width="1.2" stroke-dasharray="3 3" style="stroke:var(--fig-grid)"/>
    <text x="105" y="162" text-anchor="middle" font-weight="600" style="fill:var(--fig-ink)">a price list</text>
    <text x="105" y="178" text-anchor="middle" style="fill:var(--fig-muted)">what each part</text>
    <text x="105" y="192" text-anchor="middle" style="fill:var(--fig-muted)">costs to crush</text>

    <line x1="287" y1="112" x2="287" y2="146" stroke-width="1.2" stroke-dasharray="3 3" style="stroke:var(--fig-grid)"/>
    <text x="287" y="162" text-anchor="middle" font-weight="600" style="fill:var(--fig-ink)">a recipe</text>
    <text x="287" y="178" text-anchor="middle" style="fill:var(--fig-muted)">bits per layer, fitted</text>
    <text x="287" y="192" text-anchor="middle" style="fill:var(--fig-muted)">to your memory ceiling</text>

    <line x1="469" y1="112" x2="469" y2="146" stroke-width="1.2" stroke-dasharray="3 3" style="stroke:var(--fig-grid)"/>
    <text x="469" y="162" text-anchor="middle" font-weight="600" style="fill:var(--fig-accent-2)">a verdict</text>
    <text x="469" y="178" text-anchor="middle" style="fill:var(--fig-muted)">solve again if the damage</text>
    <text x="469" y="192" text-anchor="middle" style="fill:var(--fig-muted)">beat the prediction</text>

    <line x1="651" y1="112" x2="651" y2="146" stroke-width="1.2" stroke-dasharray="3 3" style="stroke:var(--fig-grid)"/>
    <text x="651" y="162" text-anchor="middle" font-weight="600" style="fill:var(--fig-ink)">a file</text>
    <text x="651" y="178" text-anchor="middle" style="fill:var(--fig-muted)">that fits the card</text>
    <text x="651" y="192" text-anchor="middle" style="fill:var(--fig-muted)">you actually own</text>
  </g>

  <!-- the loop back -->
  <path d="M469,206 L469,238 L287,238 L287,214" fill="none" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#vramfit-pipeline-arrow)" opacity="0.9" style="stroke:var(--fig-accent-2)"/>
  <text x="378" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" style="fill:var(--fig-accent-2)">a failed validation sends you back to the solver, not on to the pack</text>

  <text x="24" y="288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" style="fill:var(--fig-muted)">The measurement is the product. The file is just what falls out of it.</text>
</svg>
