<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The four steps: scan the model to produce a per-layer price list, plan a recipe against a memory ceiling, validate the recipe against the prediction, then pack the file and test it.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="24" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#94a3b8">Four steps, and what each one hands to the next</text>

  <!-- step boxes -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="30" y="58" width="150" height="52" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.8"/>
    <text x="105" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">Scan</text>
    <text x="105" y="100" text-anchor="middle" font-size="11.5" fill="#94a3b8">crush one part at a time</text>

    <rect x="212" y="58" width="150" height="52" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.8"/>
    <text x="287" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">Plan</text>
    <text x="287" y="100" text-anchor="middle" font-size="11.5" fill="#94a3b8">spend where it counts</text>

    <rect x="394" y="58" width="150" height="52" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="469" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">Validate</text>
    <text x="469" y="100" text-anchor="middle" font-size="11.5" fill="#fbbf24">did the maths hold?</text>

    <rect x="576" y="58" width="150" height="52" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.8"/>
    <text x="651" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">Pack</text>
    <text x="651" y="100" text-anchor="middle" font-size="11.5" fill="#94a3b8">build it, then test it</text>
  </g>

  <!-- arrows between steps -->
  <line x1="182" y1="84" x2="208" y2="84" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="364" y1="84" x2="390" y2="84" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="546" y1="84" x2="572" y2="84" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- what each hands on -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">
    <line x1="105" y1="112" x2="105" y2="146" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="105" y="162" text-anchor="middle" font-weight="600" fill="#cbd5e1">a price list</text>
    <text x="105" y="178" text-anchor="middle" fill="#64748b">what each part</text>
    <text x="105" y="192" text-anchor="middle" fill="#64748b">costs to crush</text>

    <line x1="287" y1="112" x2="287" y2="146" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="287" y="162" text-anchor="middle" font-weight="600" fill="#cbd5e1">a recipe</text>
    <text x="287" y="178" text-anchor="middle" fill="#64748b">bits per layer, fitted</text>
    <text x="287" y="192" text-anchor="middle" fill="#64748b">to your memory ceiling</text>

    <line x1="469" y1="112" x2="469" y2="146" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="469" y="162" text-anchor="middle" font-weight="600" fill="#fbbf24">a verdict</text>
    <text x="469" y="178" text-anchor="middle" fill="#64748b">solve again if the damage</text>
    <text x="469" y="192" text-anchor="middle" fill="#64748b">beat the prediction</text>

    <line x1="651" y1="112" x2="651" y2="146" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="651" y="162" text-anchor="middle" font-weight="600" fill="#cbd5e1">a file</text>
    <text x="651" y="178" text-anchor="middle" fill="#64748b">that fits the card</text>
    <text x="651" y="192" text-anchor="middle" fill="#64748b">you actually own</text>
  </g>

  <!-- the loop back -->
  <path d="M469,206 L469,238 L287,238 L287,214" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" opacity="0.9"/>
  <text x="378" y="256" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#fbbf24">a failed validation sends you back to the solver, not on to the pack</text>

  <text x="24" y="288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748b">The measurement is the product. The file is just what falls out of it.</text>
</svg>
